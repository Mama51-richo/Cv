<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser AI Chatbot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #18181b; color: #f4f4f5; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #27272a; padding: 15px; text-align: center; border-bottom: 1px solid #3f3f46; }
        h1 { margin: 0; font-size: 1.2rem; color: #a1a1aa; }
        #status { font-size: 0.85rem; color: #38bdf8; margin-top: 5px; }
        #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 75%; line-height: 1.5; font-size: 0.95rem; }
        .user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #27272a; color: #f4f4f5; align-self: flex-start; border-bottom-left-radius: 2px; }
        #controls { padding: 20px; display: flex; gap: 10px; background: #27272a; border-top: 1px solid #3f3f46; }
        input { flex: 1; padding: 12px; border: 1px solid #3f3f46; border-radius: 8px; background: #09090b; color: white; font-size: 1rem; }
        input:focus { outline: 2px solid #2563eb; }
        button { padding: 12px 24px; border: none; border-radius: 8px; background: #2563eb; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        button:disabled { background: #52525b; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #1d4ed8; }
    </style>
</head>
<body>

    <header>
        <h1>My Local Browser AI</h1>
        <div id="status">Loading AI engine... (This takes a few seconds)</div>
    </header>

    <div id="chat">
        <div class="msg ai">Hello! I am an AI running 100% locally in your browser. No data leaves your machine. Once the initial download completes, ask me anything!</div>
    </div>

    <div id="controls">
        <input type="text" id="userInput" placeholder="Type a message..." disabled onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <!-- Import Transformers.js directly using a script module -->
    <script type="module">
        import { pipeline } from 'https://jsdelivr.net';

        let generator = null;
        const statusEl = document.getElementById('status');
        const inputEl = document.getElementById('userInput');
        const btnEl = document.getElementById('sendBtn');

        // Initialize the AI Model
        async function initAI() {
            try {
                statusEl.innerText = "Downloading AI Model (~900MB)... Please wait.";
                
                // Using a lightweight chat model
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
                
                statusEl.innerText = "⚡ AI Ready & Running Locally!";
                inputEl.disabled = false;
                btnEl.disabled = false;
            } catch (err) {
                statusEl.innerText = "Error loading AI. Make sure you use a modern browser like Chrome/Edge.";
                console.error(err);
            }
        }

        // Handle sending messages
        window.sendMessage = async function() {
            const text = inputEl.value.trim();
            if (!text || !generator) return;

            appendMessage(text, 'user');
            inputEl.value = '';
            inputEl.disabled = true;
            btnEl.disabled = true;
            statusEl.innerText = "AI is thinking...";

            try {
                // Format prompt for chat template
                const messages = [{ role: "user", content: text }];
                
                const output = await generator(messages, { 
                    max_new_tokens: 150,
                    temperature: 0.7
                });

                const aiResponse = output[0].generated_text[1].content;
                appendMessage(aiResponse, 'ai');
            } catch (error) {
                appendMessage("Sorry, an error occurred while processing.", 'ai');
                console.error(error);
            }

            inputEl.disabled = false;
            btnEl.disabled = false;
            statusEl.innerText = "⚡ AI Ready";
            inputEl.focus();
        }

        function appendMessage(text, sender) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = `msg ${sender}`;
            msg.innerText = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        // Start loading the model on page load
        initAI();
    </script>
</body>
</html>
