<!DOCTYPE html>
<html lang="en" data-theme="light" data-fontsize="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B1F3A">
    <meta name="description" content="Libra CareerForge - Build Better. Match Smarter. Apply Stronger.">
    <title>Libra CareerForge 🗽</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar-nav.css">
</head>
<body>
    <div id="app">
        <header id="app-header">
            <div class="header-left">
                <button id="menu-btn" class="header-btn" aria-label="Menu"><i class="fas fa-bars"></i></button>
                <button id="back-btn" class="header-btn hidden" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
            </div>
            <div class="header-center">
                <span id="header-title">Libra CareerForge</span>
            </div>
            <div class="header-right">
                <button id="search-btn" class="header-btn" aria-label="Search"><i class="fas fa-search"></i></button>
                <button id="settings-btn" class="header-btn" aria-label="Settings"><i class="fas fa-gear"></i></button>
            </div>
        </header>
        <!-- Sidebar nav drawer (neumorphic morphing rail) -->
        <div id="sidebar-backdrop" class="sn3n-backdrop"></div>
        <section id="sidebar-drawer" class="sn3n-drawer" aria-hidden="true">
            <div class="sn3n-section">
                <div class="sn3n-stage">
                    <nav class="sn3n-rail" aria-label="Primary" data-sn3n>
                        <div class="sn3n-bar">
                            <!-- brand mark: Libra scales in a navy circle -->
                            <div class="sn3n-item">
                                <span class="sn3n-brand-seat">
                                    <button class="sn3n-brand-btn" type="button" aria-label="Libra CareerForge home">
                                        <span class="sn3n-logo" aria-hidden="true"><i class="fas fa-scale-balanced"></i></span>
                                    </button>
                                </span>
                            </div>
                            <div class="sn3n-divider" role="separator"></div>
                            <!-- Workspace -->
                            <ul class="sn3n-group" aria-label="Workspace">
                                <li class="sn3n-item">
                                    <button class="sn3n-btn" type="button" aria-current="page" aria-label="Home" data-route="home">
                                        <span class="sn3n-icon" aria-hidden="true"><i class="fas fa-house"></i></span>
                                    </button>
                                </li>
                                <li class="sn3n-item" data-sn3n-sub>
                                    <button class="sn3n-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="My CV" data-route="cv">
                                        <span class="sn3n-icon" aria-hidden="true"><i class="fas fa-file-lines"></i></span>
                                    </button>
                                    <template class="sn3n-subdata" data-title="My CV">
                                        <ul><li data-route="cv">All CVs</li></ul>
                                    </template>
                                </li>
                                <li class="sn3n-item" data-sn3n-sub>
                                    <button class="sn3n-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Job Match" data-route="job">
                                        <span class="sn3n-icon" aria-hidden="true"><i class="fas fa-bullseye"></i></span>
                                    </button>
                                    <template class="sn3n-subdata" data-title="Job Match">
                                        <ul><li data-route="job/analyze">Analyze a Job</li><li data-route="job">All Jobs</li></ul>
                                    </template>
                                </li>
                            </ul>
                            <div class="sn3n-divider" role="separator"></div>
                            <!-- Admin -->
                            <ul class="sn3n-group" aria-label="Admin">
                                <li class="sn3n-item" data-sn3n-sub>
                                    <button class="sn3n-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Applications" data-route="applications">
                                        <span class="sn3n-icon" aria-hidden="true"><i class="fas fa-briefcase"></i></span>
                                    </button>
                                    <template class="sn3n-subdata" data-title="Applications">
                                        <ul><li data-route="applications">Pipeline</li><li data-route="applications/edit">Add New</li></ul>
                                    </template>
                                </li>
                                <li class="sn3n-item" data-sn3n-sub>
                                    <button class="sn3n-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Settings" data-route="settings">
                                        <span class="sn3n-icon" aria-hidden="true"><i class="fas fa-gear"></i></span>
                                    </button>
                                    <template class="sn3n-subdata" data-title="Settings">
                                        <ul><li data-route="settings">General</li><li data-route="reports">Reports</li><li data-route="interview">Interview Prep</li></ul>
                                    </template>
                                </li>
                            </ul>
                        </div>
                        <!-- morph panel (submenu) -->
                        <div class="sn3n-panel">
                            <div class="sn3n-panel-inner">
                                <div class="sn3n-panel-head">
                                    <span class="sn3n-panel-title"></span>
                                    <button class="sn3n-close" type="button" aria-label="Close submenu">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
                                    </button>
                                </div>
                                <ul class="sn3n-sub"></ul>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </section>
        <main id="view-container"></main>
        <nav id="bottom-nav">
            <a class="nav-item active" data-route="home"><i class="fas fa-house"></i><span>Home</span></a>
            <a class="nav-item" data-route="cv"><i class="fas fa-file-lines"></i><span>My CV</span></a>
            <a class="nav-item" data-route="job"><i class="fas fa-bullseye"></i><span>Job Match</span></a>
            <a class="nav-item" data-route="applications"><i class="fas fa-briefcase"></i><span>Applications</span></a>
            <a class="nav-item" data-route="profile"><i class="fas fa-user"></i><span>Profile</span></a>
        </nav>
        <button id="libra-ai-btn" aria-label="Libra AI Assistant">🗽</button>
        <div id="libra-panel" class="libra-panel"></div>
        <div id="modal-container"></div>
        <div id="toast-container"></div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/cv.js"></script>
    <script src="js/job-analyzer.js"></script>
    <script src="js/applications.js"></script>
    <script src="js/interview.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sidebar-nav.js"></script>
</body>
</html>
