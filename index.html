<!DOCTYPE html>
<html lang="en" data-theme="light" data-fontsize="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B1F3A">
    <meta name="description" content="Libra CareerForge - Build Better. Match Smarter. Apply Stronger.">
    <title>Libra CareerForge 🗽</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header id="app-header">
            <div class="header-left">
                <button id="back-btn" class="header-btn hidden" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
            </div>
            <div class="header-center">
                <span id="header-title">Libra CareerForge</span>
            </div>
            <div class="header-right">
                <button id="search-btn" class="header-btn" aria-label="Search"><i class="fas fa-search"></i></button>
                <button id="settings-btn" class="header-btn" aria-label="Settings"><i class="fas fa-gear"></i></button>
            </div>
        </header>
        <main id="view-container"></main>
        <nav id="bottom-nav">
            <a class="nav-item active" data-route="home"><i class="fas fa-house"></i><span>Home</span></a>
            <a class="nav-item" data-route="cv"><i class="fas fa-file-lines"></i><span>My CV</span></a>
            <a class="nav-item" data-route="job"><i class="fas fa-bullseye"></i><span>Job Match</span></a>
            <a class="nav-item" data-route="applications"><i class="fas fa-briefcase"></i><span>Applications</span></a>
            <a class="nav-item" data-route="profile"><i class="fas fa-user"></i><span>Profile</span></a>
        </nav>
        <button id="libra-ai-btn" aria-label="Libra AI Assistant">🗽</button>
        <div id="libra-panel" class="libra-panel"></div>
        <div id="modal-container"></div>
        <div id="toast-container"></div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/cv.js"></script>
    <script src="js/job-analyzer.js"></script>
    <script src="js/applications.js"></script>
    <script src="js/interview.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
