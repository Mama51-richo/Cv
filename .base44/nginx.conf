# Base44 preview server for ProCV Studio (static index.html, no build step).
# Only the app files bind-mounted by docker-compose.base44.yml are served;
# the rest of the checkout is not reachable over HTTP.
server {
    listen 80;
    server_name _;
    root /site;
    index index.html;

    # app entry point
    location = / {
        try_files /index.html =404;
    }

    # mounted app assets only, everything else is a 404
    location / {
        try_files $uri =404;
    }
}
