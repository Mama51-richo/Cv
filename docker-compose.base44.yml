services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Serve straight from the checkout so source edits are live.
      # The checkout root is mode 0700, which the nginx worker user cannot
      # traverse, so the app files are mounted individually (add any new
      # css/js asset here as well).
      - ./index.html:/site/index.html:ro
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 127.0.0.1 rather than localhost: inside the container `localhost`
      # resolves to ::1, where nginx (IPv4 only) is not listening.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
